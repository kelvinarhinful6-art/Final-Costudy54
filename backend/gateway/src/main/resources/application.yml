spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth
          uri: ${AUTH_SERVICE_URI:http://auth-service:8080}
          predicates:
            - Path=/api/auth/**
        - id: learning
          uri: ${LEARNING_SERVICE_URI:http://learning-service:8080}
          predicates:
            - Path=/api/groups/**,/api/matching/**,/api/invites/**,/api/study/**,/api/support/**
        - id: learning-ws
          uri: ${LEARNING_WS_URI:ws://learning-service:8080}
          predicates:
            - Path=/ws,/ws/**
        - id: tutoring-uploads
          uri: ${TUTORING_SERVICE_URI:http://tutoring-service:8080}
          predicates:
            - Path=/uploads/questions/**
          filters:
            - StripPrefix=0
        - id: learning-uploads
          uri: ${LEARNING_SERVICE_URI:http://learning-service:8080}
          predicates:
            - Path=/uploads/**
          filters:
            - StripPrefix=0
        - id: tutoring
          uri: ${TUTORING_SERVICE_URI:http://tutoring-service:8080}
          predicates:
            - Path=/api/tutor-applications/**,/api/admin/**,/api/tutors/**,/api/subscriptions/**,/api/bookings/**,/api/reviews/**,/api/courses/**
        - id: engagement
          uri: ${ENGAGEMENT_SERVICE_URI:http://engagement-service:8080}
          predicates:
            - Path=/api/notifications/**,/api/analytics/**,/api/ads/**
        - id: payment
          uri: ${PAYMENT_SERVICE_URI:http://payment-service:8080}
          predicates:
            - Path=/api/payments/**


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
