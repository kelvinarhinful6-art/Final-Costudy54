# Render Blueprint deployment for StudySync Backend
databases:
  - name: studysync-postgres
    databaseName: studysync
    user: studysync
    plan: free

services:
  # 1. Gateway Service (Public Endpoint for Mobile App & Web)
  - type: web
    name: studysync-gateway
    env: docker
    dockerfilePath: gateway/Dockerfile
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: AUTH_SERVICE_URI
        value: https://studysync-auth-eg8u.onrender.com
      - key: LEARNING_SERVICE_URI
        value: http://studysync-learning:8080
      - key: TUTORING_SERVICE_URI
        value: http://studysync-tutoring:8080
      - key: PAYMENT_SERVICE_URI
        value: http://studysync-payment:8080
      - key: ENGAGEMENT_SERVICE_URI
        value: http://studysync-engagement:8080

  # 2. Auth Service
  - type: web
    name: studysync-auth
    env: docker
    dockerfilePath: auth-service/Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-d9h6dvcm0tmc73bus3eg-a.oregon-postgres.render.com:5432/studysync_7ppw?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
      - key: DB_USER
        fromDatabase:
          name: studysync-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: MAIL_USERNAME
        value: costudy.server@gmail.com
      - key: MAIL_PASSWORD
        value: "iqwf kppr zzet xvaz"

  # 3. Learning Service
  - type: web
    name: studysync-learning
    env: docker
    dockerfilePath: learning-service/Dockerfile
    plan: free
    envVars:
      - key: DB_URL
        value: jdbc:postgresql://dpg-d9h6dvcm0tmc73bus3eg-a.oregon-postgres.render.com:5432/studysync_7ppw?sslmode=require&sslfactory=org.postgresql.ssl.NonValidatingFactory
      - key: DB_USER
        fromDatabase:
          name: studysync-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password

  # 4. Tutoring Service
