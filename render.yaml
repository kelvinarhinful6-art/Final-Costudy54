databases:
  - name: studysync-postgres
    databaseName: studysync
    user: studysync
    plan: free

services:
  - type: web
    name: studysync-auth
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/auth-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: studysync-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studysync-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: studysync-postgres
          property: database
      - key: DB_USER
        value: studysync
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXP_MIN
        value: "15"

  - type: web
    name: studysync-gateway
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/gateway/Dockerfile
    healthCheckPath: /actuator/health

  - type: web
    name: studysync-learning
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/learning-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: studysync-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studysync-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: studysync-postgres
          property: database
      - key: DB_USER
        value: studysync
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password
      - key: FREE_MAX_GROUPS
        value: "10"

  - type: web
    name: studysync-tutoring
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/tutoring-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: studysync-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studysync-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: studysync-postgres
          property: database
      - key: DB_USER
        value: studysync
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password

  - type: web
    name: studysync-engagement
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/engagement-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: studysync-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studysync-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: studysync-postgres
          property: database
      - key: DB_USER
        value: studysync
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password

  - type: web
    name: studysync-payment
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/payment-service/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: studysync-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: studysync-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: studysync-postgres
          property: database
      - key: DB_USER
        value: studysync
      - key: DB_PASS
        fromDatabase:
          name: studysync-postgres
          property: password
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
